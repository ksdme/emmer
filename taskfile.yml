version: "3"

vars:
  PREFIX:
    sh: echo "$HOME/.local"
  BINDIR: "{{.PREFIX}}/bin"
  DBUSDIR: "{{.PREFIX}}/share/dbus-1/services"
  UNITDIR: "{{.PREFIX}}/share/systemd/user"

tasks:
  build:
    cmds:
      - cargo build --release

  install:
    cmds:
      - install -Dm755 target/release/emmer "{{.BINDIR}}/emmer"
      - sed 's|@bindir@|{{.BINDIR}}|g' contrib/dev.ksdme.emmer.service | install -Dm644 /dev/stdin "{{.DBUSDIR}}/dev.ksdme.emmer.service"
      - sed 's|@bindir@|{{.BINDIR}}|g' contrib/emmer.service | install -Dm644 /dev/stdin "{{.UNITDIR}}/emmer.service"

  uninstall:
    cmds:
      - rm -f "{{.BINDIR}}/emmer" "{{.DBUSDIR}}/dev.ksdme.emmer.service" "{{.UNITDIR}}/emmer.service"

  run:
    cmds:
      - systemctl stop --user mako.service
      - RUST_LOG=emmer=debug cargo run -- --debug-mode

  long:
    cmds:
      - notify-send "Long Message" "This is a very long piece of text. This line of text will make it even longer. The third line might just make it too much. I think I need another line to make it even longer." --icon file:///home/ksdme/me/emmer/data/rust.png

  short:
    cmds:
      - notify-send "Short Message" "This is a short card." --icon file:///home/ksdme/me/emmer/data/rust.png

  sound:
    cmds:
      - notify-send "Sound" "This notification plays a sound." -h string:sound-name:message-new-instant --icon file:///home/ksdme/me/emmer/data/rust.png

  flood:
    cmds:
      - |
        for i in $(seq 1 15); do
          notify-send "Message" "This is the body of the notification." --icon file:///home/ksdme/me/emmer/data/rust.png;
          sleep 0.25s;
        done
