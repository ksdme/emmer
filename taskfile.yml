version: "3"

tasks:
  run:
    cmds:
      - systemctl stop --user mako.service
      - RUST_LOG=emmer=debug cargo run -- --debug-mode

  q:
    cmds:
      - notify-send "Message" "This is the body of the notification."

  flood:
    cmds:
      - |
        for i in $(seq 1 5); do
          notify-send "Message" "This is the body of the notification.";
          sleep 0.5s;
        done
